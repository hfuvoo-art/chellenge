# Собирает Docker-образ «Цифрового деканата» и кладёт его в GitHub Container Registry.
# Сервер в Yandex Cloud сам забирает свежий образ раз в 5 минут (watchtower), секреты не нужны.
name: publish-dekanat
on:
  workflow_dispatch:
  push:
    branches: [main, claude/project-thread-hfs6t6]
    paths: ["02-vibe-coding/app/**", ".github/workflows/publish-dekanat.yml"]

concurrency: publish-dekanat

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 02-vibe-coding/app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: 02-vibe-coding/app/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: 02-vibe-coding/app
          push: true
          tags: ghcr.io/hfuvoo-art/dekanat:latest
