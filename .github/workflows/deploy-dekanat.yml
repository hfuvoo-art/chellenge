# Выкладка «Цифрового деканата» на виртуальную машину Yandex Cloud.
# Секреты задаются в GitHub: Settings → Secrets and variables → Actions:
#   VM_HOST (IP сервера), VM_USER (пользователь, например dekanat), VM_SSH_KEY (закрытый SSH-ключ).
name: deploy-dekanat
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["02-vibe-coding/app/**", ".github/workflows/deploy-dekanat.yml"]

concurrency: deploy-dekanat

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 02-vibe-coding/app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: 02-vibe-coding/app/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Сервер ещё не настроен
        if: env.VM_HOST == ''
        run: echo "Секрет VM_HOST не задан, выкладку пропускаем."
      - name: Копируем код на сервер
        if: env.VM_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "02-vibe-coding/app/*,!02-vibe-coding/app/node_modules,!02-vibe-coding/app/.next,!02-vibe-coding/app/data"
          target: "~/dekanat-src"
          rm: true
      - name: Пересобираем и перезапускаем
        if: env.VM_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/dekanat
            rsync -a --delete --exclude .env ~/dekanat-src/02-vibe-coding/app/ ~/dekanat/
            cd ~/dekanat
            test -f .env || { echo "Нет файла ~/dekanat/.env, см. 02-vibe-coding/vykladka-yandex-cloud.md"; exit 1; }
            docker compose up -d --build
            docker image prune -f
